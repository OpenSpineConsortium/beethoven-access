# Deploys the access service (worker.js, storage.js, wrangler.toml) to Cloudflare whenever a change to it
# lands on main, under both Worker names, the way deploy.sh deploys the code (README.md, "Two names" and
# "Deploying from GitHub"). greg's decision of 2026-10-07; this workflow came with the service from
# Beethoven for VS Code's repository, where it was deploy-access.yml.
#
# It reads two secrets of the environment cloudflare, which greg saves himself and limits to main (Settings,
# Environments, cloudflare): CLOUDFLARE_API_TOKEN, a Cloudflare API token limited to Workers, and
# CLOUDFLARE_ACCOUNT_ID. Limited to Workers is not small: whoever holds the token can put any code under these
# two names, and that code runs with everything the service holds, its secrets (the admin token, the trial
# signing key, the decision key, the mail key) and its records (the approved list, and the readers list the
# grid turns into read access on the lab volume). So the token is the environment's and not the repository's:
# a workflow pushed on any other branch cannot read it. Both reach one step only, through its environment,
# where wrangler reads them; neither is ever an argument or printed. Until both are saved the deploy job says
# so and passes. Nothing here runs Claude Code or holds an Anthropic key.
#
# What stays manual, with deploy.sh on the maintainer's machine, and why:
# - the Worker's own secrets (ADMIN_TOKEN, DECIDE_KEY, IP_SALT, the trial key, the mail settings): they come
#   from the vendor folder, which never enters the repository or CI. A deploy keeps the secrets a Worker
#   holds (wrangler: "secrets are never deleted by deployments"), so deploy.sh is needed only when one
#   changes, or for a Worker name's first deploy.
# - the KV namespaces: never created here. Their ids are in wrangler.toml, checked before each deploy, and
#   wrangler's automatic provisioning is switched off, so a binding without an id stops the deploy.
# - the website's beethoven/services.json: it is the site repository's. deploy.sh prints the addresses it
#   carries, which change only with a Worker's name or account, never with a code deploy.
name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'storage.js'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'
      - '.github/deploy/**'
  workflow_dispatch:

permissions:
  contents: read

# One run at a time for each branch, for the whole workflow and not per job, so a newer change on main is
# never overtaken by an older run that started before it. A run that has started is never cancelled; a newer
# one waits, and of several waiting only the newest runs. GitHub cancels a waiting run when another joins its
# group, so a run started by hand on another branch, which deploys nothing, has a group of its own and never
# takes the place of main's. A re-run keeps the commit of the run it repeats, so the deploy job also checks
# that its code is still main's before it deploys.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      # README.md's test line, as ci.yml runs it: nothing installed, no secret
      - run: node --test test/*.test.mjs

  deploy:
    needs: test
    # main's code only, also when the run is started by hand from another branch
    if: github.ref == 'refs/heads/main'
    # the two Cloudflare secrets are this environment's, which greg limits to main
    environment: cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # true or false only: the values themselves never enter this step
      - name: Are both secrets saved?
        id: secrets
        env:
          HAVE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAVE_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          if [ "$HAVE_TOKEN" = true ] && [ "$HAVE_ACCOUNT" = true ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MSG="The access service was not deployed: it is deployed from here once greg saves both secrets, CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, in the environment cloudflare, limited to main (Settings, Environments, cloudflare). Until then deploy with deploy.sh."
          echo "::notice title=Deploy skipped::$MSG"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
          echo "ready=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.ready == 'true'
        with:
          persist-credentials: false

      # A re-run deploys the commit of the run it repeats (GitHub's rule), so re-running an older run after a
      # newer one deployed would put older code back under both names. main as it is now goes beside this
      # run's commit, in a checkout of its own: the one above cannot tell, since the action points origin/main
      # at the run's own commit, even when it fetches the whole history (its ref-helper's getRefSpec).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.ready == 'true'
        with:
          ref: refs/heads/main
          path: .main-now
          persist-credentials: false

      # Only the Worker's three files are compared, not the commit: a later change elsewhere leaves this one's
      # deploy still needed.
      - name: Is this still main's code?
        id: current
        if: steps.secrets.outputs.ready == 'true'
        run: |
          MOVED=""
          for f in worker.js storage.js wrangler.toml; do
            cmp -s "$f" ".main-now/$f" || MOVED="${MOVED:+$MOVED, }$f"
          done
          if [ -z "$MOVED" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MSG="The access service was not deployed: main's $MOVED changed after this commit, and the run for main's newer code deploys that. A re-run of an older run never puts older code back."
          echo "::notice title=Deploy skipped::$MSG"
          echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
          echo "current=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.current.outputs.current == 'true'
        with:
          node-version: '22'
          package-manager-cache: false

      # deploy.sh's check, without creating anything: each binding names a namespace id
      - name: wrangler.toml names the three KV namespaces
        if: steps.current.outputs.current == 'true'
        run: |
          node -e '
            const t = require("fs").readFileSync("wrangler.toml", "utf8");
            const missing = ["TRIALS", "REPORTS", "ACCESS"].filter((b) => !new RegExp("binding = \"" + b + "\"\\r?\\nid = \"[0-9a-f]{32}\"").test(t));
            if (missing.length) {
              console.error("no namespace id in wrangler.toml for " + missing.join(", ") + ": nothing is created from here; deploy.sh makes them on a first deploy");
              process.exit(3);
            }
            console.log("TRIALS, REPORTS and ACCESS each name a namespace id");'

      # In a step that holds no secret, and only what .github/deploy/package-lock.json names by hash: the code
      # that will hold the token is the code on record, not whatever the registry serves that day. wrangler
      # 4.148.0 was the latest 4.x on 2026-10-07 (npm view wrangler version). To raise it: change the version
      # in .github/deploy/package.json, run npm install --package-lock-only there, and see that the flags
      # below still exist in the new version.
      - name: Install wrangler as package-lock.json fixes it
        if: steps.current.outputs.current == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/wrangler"
          cp .github/deploy/package.json .github/deploy/package-lock.json "$RUNNER_TEMP/wrangler/"
          npm ci --prefix "$RUNNER_TEMP/wrangler" --no-audit --no-fund
          echo "wrangler $("$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler" --version)"

      # deploy.sh's deploy and check, for each name in turn: the code with SERVICE_NAME set to the name (both
      # run the daily cron; only REMINDER_FROM in wrangler.toml sends the reminder), then /health on the
      # workers.dev address the deploy printed. ashley-service is not deployed when beethoven-access fails. A
      # failure after beethoven-access took the code leaves the two names on different code until a run
      # deploys both, and the run's summary says so.
      - name: Deploy beethoven-access and ashley-service
        if: steps.current.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
          WRANGLER_SEND_ERROR_REPORTS: 'false'
        run: |
          W="$RUNNER_TEMP/wrangler/node_modules/.bin/wrangler"
          TOOK=""
          stop() {
            if [ "$TOOK" = beethoven-access ]; then
              MSG="The two names now run different code: beethoven-access runs this commit's, ashley-service what it ran before. Re-run this job once the cause above is fixed; if main has newer code by then, the re-run skips and the run for that code deploys both."
              echo "::error title=The two names differ::$MSG"
              echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
            fi
            exit "$1"
          }
          for NAME in beethoven-access ashley-service; do
            echo "== deploy ($NAME)"
            # --x-provision=false: a binding without an id is an error, never a new namespace
            OUT=$("$W" deploy --name "$NAME" --var "SERVICE_NAME:$NAME" --x-provision=false 2>&1) || { printf '%s\n' "$OUT" | tail -20; stop 5; }
            TOOK="${TOOK:+$TOOK }$NAME"
            URL=$(printf '%s' "$OUT" | grep -oE "https://$NAME\.[a-z0-9.-]+\.workers\.dev" | head -1) || true
            [ -n "$URL" ] || { printf '%s\n' "$OUT" | tail -20; echo "no workers.dev address for $NAME in the deploy output"; stop 5; }
            echo "  $URL"
            printf '%s\n' "$OUT" | grep -E "schedule:" | sed -E 's/^[[:space:]]*/  cron /' || echo "  no cron in the deploy output: check [triggers] in wrangler.toml"
            sleep 3
            BODY=$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors --max-time 20 "$URL/health") || { echo "  $URL/health did not answer"; stop 6; }
            [ "$BODY" = '{"ok":true}' ] || { echo "  $URL/health answered $BODY"; stop 6; }
            echo "  $URL/health: $BODY"
            echo "- $NAME deployed at $URL; /health answered $BODY" >> "$GITHUB_STEP_SUMMARY"
          done
